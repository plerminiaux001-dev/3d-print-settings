<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Printing Hub</title>
    <style>
        :root {
            --earth-green: #6b8e23; --earth-brown: #8b4513; --cream: #fdfaf5; --text: #3e3e3e;
        }
        body { font-family: -apple-system, sans-serif; background: var(--cream); color: var(--text); margin: 0; }
        .container { max-width: 900px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Tab System */
        .tabs { display: flex; gap: 10px; margin-bottom: 2rem; border-bottom: 2px solid #d2c4b5; }
        .tab-button { padding: 10px 20px; cursor: pointer; border: none; background: #e8e0d5; border-radius: 5px 5px 0 0; font-weight: bold; color: var(--text); }
        .tab-button.active { background: var(--earth-green); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        header { background: #4a5d4e; color: white; padding: 1.5rem; margin: -2rem -2rem 2rem -2rem; border-radius: 8px 8px 0 0; text-align: center; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--earth-green); color: white; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>3D Printing Hub</h1></header>

    <div class="tabs">
        <button class="tab-button active" onclick="openTab('inventory')">Inventory</button>
        <button class="tab-button" onclick="openTab('guides')">Slicer Guides</button>
    </div>

    <div id="inventory" class="tab-content active">
        <h2>Filament Stock</h2>
        </div>

    <div id="guides" class="tab-content">
        <h2>Fusion 360 & Slicer Guide</h2>
        <p>Your original guide content goes here...</p>
        </div>

    <footer><p style="text-align:center; color:#888; font-size:0.8rem; margin-top:2rem;">Last Updated: </p></footer>
</div>

<script>
    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
