<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Printing Hub</title>
    <style>
        :root {
            --primary: #6b8e23; --secondary: #8b4513; --bg: #fdfaf5; --text: #3e3e3e; --border: #d2c4b5;
        }
        body { font-family: -apple-system, system-ui, sans-serif; line-height: 1.6; color: var(--text); background-color: var(--bg); margin: 0; }
        .container { max-width: 900px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        header { background: #4a5d4e; color: white; padding: 1.5rem; text-align: center; border-radius: 8px 8px 0 0; margin: -2rem -2rem 2rem -2rem; }
        
        /* Tab System */
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #e8e0d5; font-weight: bold; border-radius: 5px 5px 0 0; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .step-box { background: #f9f6f2; border-left: 5px solid var(--secondary); padding: 1rem; margin: 1rem 0; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>3D Printing Hub</h1></header>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('inv')">Filament Inventory</button>
        <button class="tab-btn" onclick="showTab('guide')">Slicer Guides</button>
    </div>

    <div id="inv" class="tab-content active">
        <h2>Current Stock</h2>
        </div>

    <div id="guide" class="tab-content">
        <h2>Fusion 360: Thread Solutions</h2>
        <div class="step-box">
            <h3>Method A: Offset Face</h3>
            <p>Go to <b>Modify > Offset Face</b>. Select angled faces. Use <code>-0.15mm</code>.</p>
        </div>
        </div>

    <footer style="margin-top:2rem; font-size:0.8rem; color:#888; text-align:center;">
        Auto-Sync: </footer>
</div>

<script>
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
