name: Update Filament Inventory

on:
  push:
    paths:
      - 'To_Inventory/**'
      - 'Filament Inventory - Inventory.csv'
      - 'template.html'
      - 'update_inventory.py'
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run inventory script
        run: python update_inventory.py

      - name: Safety Check - Purge Large Files
        # This prevents the "pre-receive hook declined" error by deleting index.html if it's over 50MB
        run: |
          find . -name "index.html" -size +50M -delete
          find . -name "template.html" -size +50M -delete

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add .
          # The "exit 0" prevents the action from failing if there are no changes to save
          git commit -m "Auto-update inventory and dashboard" || exit 0
          git push
