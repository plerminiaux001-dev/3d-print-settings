- name: Run inventory script
        run: python update_inventory.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          # SAFETY: If index.html is still huge, delete it so the push succeeds
          find . -name "index.html" -size +50M -delete
          
          git add .
          git commit -m "Auto-update inventory" || exit 0
          git push
